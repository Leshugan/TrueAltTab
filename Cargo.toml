[package]
name = "TrueAltTab"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "TrueAltTab"
path = "src/main.rs"

[dependencies.windows-sys]
version = "=0.52.0"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Globalization",
]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
